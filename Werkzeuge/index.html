<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2RAT Tools – Zugang</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1678A9;--blue-dark:#115d85;--blue-light:#e8f4fa;
  --green:#669B3B;--green-dark:#4a7332;--green-light:#eef5e6;
  --gray:#525353;--gray-light:#8a8a8a;--gray-border:#d9d9d9;
  --bg:#f5f7f9;--white:#ffffff;
  --red:#c0392b;--red-light:#fdecea;
}
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap');
body{font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;color:var(--gray);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--white);border-bottom:3px solid var(--green);padding:18px 24px}
.header-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px}
.header-sub{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-light)}
.header-title{font-size:17px;font-weight:700;color:var(--gray);line-height:1.3}
.header-right{text-align:right;font-size:11px;color:var(--gray-light);line-height:1.5}
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{background:var(--white);border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,.08);padding:44px 40px;max-width:420px;width:100%}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--gray)}
.login-card .subtitle{font-size:14px;color:var(--gray-light);margin-bottom:28px;line-height:1.5}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-light);margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-border);border-radius:8px;font-size:15px;font-family:inherit;color:var(--gray);transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--blue)}
.login-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s;margin-top:6px}
.login-btn:hover{background:var(--blue-dark)}
.error-msg{background:var(--red-light);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.error-msg.show{display:block}
.dashboard{display:none;max-width:800px;margin:0 auto;padding:32px 20px 60px;width:100%}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-header h2{font-size:22px;font-weight:700}
.logout-btn{background:none;border:1.5px solid var(--gray-border);border-radius:8px;padding:8px 16px;font-size:13px;font-family:inherit;color:var(--gray-light);cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.license-info{font-size:13px;color:var(--gray-light);margin-bottom:28px}
.license-info strong{color:var(--green-dark)}
.license-info .expired{color:var(--red);font-weight:700}
.tool-card{background:var(--white);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:28px;margin-bottom:20px;border-left:4px solid var(--blue);transition:transform .15s,box-shadow .15s}
.tool-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.tool-card h3{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--gray)}
.tool-card .tool-desc{font-size:14px;color:var(--gray-light);margin-bottom:16px;line-height:1.5}
.tool-card .tool-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--blue-light);color:var(--blue-dark)}
.tag.green{background:var(--green-light);color:var(--green-dark)}
.open-btn{display:inline-block;padding:10px 22px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;transition:background .2s}
.open-btn:hover{background:var(--green-dark)}
.tool-card:nth-child(2){border-left-color:var(--green)}
.footer{padding:20px;text-align:center;font-size:11px;color:var(--gray-light)}
.footer a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <img class="header-logo" id="logo" alt="2RAT" src="">
      <div>
        <div class="header-sub">Büro für Radverkehrsplanung</div>
        <div class="header-title">Tool-Portal</div>
      </div>
    </div>
    <div class="header-right">Lizenzierter Zugang<br>Radverkehrs-Tools Saarland</div>
  </div>
</div>

<div class="center-wrap" id="loginView">
  <div class="login-card">
    <h2>Anmelden</h2>
    <p class="subtitle">Geben Sie Ihren Zugangscode ein, um die 2RAT Radverkehrs-Tools zu nutzen.</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label>Organisation</label>
      <input type="text" id="orgInput" placeholder="z.B. Gemeinde Kleinblittersdorf">
    </div>
    <div class="form-group">
      <label>Zugangscode</label>
      <input type="password" id="codeInput" placeholder="Ihr Zugangscode">
    </div>
    <button class="login-btn" onclick="doLogin()">Zugang freischalten</button>
  </div>
</div>

<div class="dashboard" id="dashView">
  <div class="dash-header">
    <h2 id="welcomeMsg">Willkommen</h2>
    <button class="logout-btn" onclick="doLogout()">Abmelden</button>
  </div>
  <p class="license-info" id="licenseInfo"></p>
  <div id="toolsContainer"></div>
</div>

<div class="footer">
  <strong style="color:var(--gray)">© 2RAT</strong> · Armin Jung · Radverkehrsplaner EIPOS · <a href="https://www.2rat.org">www.2rat.org</a>
</div>

/* ══════════════════════════════════════════════════════════════════

   ─────────────────────────────────────────
   kunden/   = 2RAT-Vollversionen
   agfk-sl/  = überarbeitete Versionen für AGFK Saarland

   ══════════════════════════════════════════════════════════════════ */
const PATHS = {
  "kunden":  "kunden/",
  "agfk-sl": "agfk-sl/",
  "demo":    "demo/"

/* ══════════════════════════════════════════════════════════════════
   LIZENZEN VERWALTEN
   ─────────────────
   Codes sind als SHA-256-Hash gespeichert → nicht im Klartext sichtbar!
   Neue Hashes erzeugen: hash-generator.html öffnen, Code eingeben,
   Hash kopieren und hier eintragen.

   Felder:
     hash    – SHA-256 des Zugangscodes (Pflicht)
     org     – Anzeigename der Organisation (Pflicht)
     expires – Ablaufdatum YYYY-MM-DD (Pflicht)
     target  – Ordner-Variante: "kunden" / "agfk-sl" / "demo" (Pflicht)
     tools   – Optional: Array von Tool-IDs (siehe TOOLS).
               Wenn weggelassen → alle Tools sichtbar.
   ══════════════════════════════════════════════════════════════════ */

/* ── SHA-256 ── */
async function sha256(text) {
  const data = new TextEncoder().encode(text.trim().toUpperCase());
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function findLicense(code) {
  const h = await sha256(code);
  return LICENSES.find(l => l.hash === h);
}

function isExpired(d){ return new Date(d) < new Date() }
function fmtDate(d){ return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) }

async function doLogin() {
  const code = document.getElementById('codeInput').value;
  const orgIn = document.getElementById('orgInput').value.trim();
  const err = document.getElementById('errorMsg');

  if (!code.trim()) { err.textContent='Bitte Zugangscode eingeben.'; err.classList.add('show'); return; }

  const lic = await findLicense(code);
  if (!lic) { err.textContent='Ungültiger Zugangscode.'; err.classList.add('show'); return; }
  if (isExpired(lic.expires)) { err.textContent='Zugangscode abgelaufen – bitte 2RAT kontaktieren.'; err.classList.add('show'); return; }

  err.classList.remove('show');
  sessionStorage.setItem('2rat_s', JSON.stringify({ hash:lic.hash, org:orgIn||lic.org }));
  showDash(lic, orgIn);
}

function getVisibleTools(lic) {
  const base = PATHS[lic.target] || PATHS["kunden"];
  const allowedIds = lic.tools || TOOLS.map(t => t.id);
  return TOOLS
    .filter(t => allowedIds.includes(t.id))
    .map(t => ({ ...t, url: base + t.id + ".html" }));
}

function renderTools(lic) {
  const container = document.getElementById('toolsContainer');
  const tools = getVisibleTools(lic);
  if (tools.length === 0) {
    container.innerHTML = '<p style="color:var(--gray-light);font-size:14px;padding:20px;text-align:center">Für diese Lizenz sind aktuell keine Tools freigeschaltet. Bitte 2RAT kontaktieren.</p>';
    return;
  }
  container.innerHTML = tools.map(t => {
    const tags = (t.tags || []).map((tag, i) =>
      `<span class="tag${i === 1 ? ' green' : ''}">${tag}</span>`
    ).join('');
    return `
    <div class="tool-card">
      <h3>${t.title}</h3>
      <p class="tool-desc">${t.desc}</p>
      <div class="tool-tags">${tags}<span class="tag">${labelForTarget(lic.target)}</span></div>
      <a class="open-btn" href="${t.url}" target="_blank">Tool öffnen →</a>
    </div>`;
  }).join('');
}

function labelForTarget(target) {
  return target === 'agfk-sl' ? 'AGFK-Version'
       : target === 'demo'    ? 'Demo-Version'
       :                        'Vollversion';
}

function showDash(lic, orgName) {
  document.getElementById('loginView').style.display='none';
  document.getElementById('dashView').style.display='block';
  document.getElementById('welcomeMsg').textContent=`Willkommen, ${orgName||lic.org}`;
  const days = Math.ceil((new Date(lic.expires)-new Date())/(864e5));
  const el = document.getElementById('licenseInfo');
  if (days<=30) el.innerHTML=`Lizenz bis: <span class="expired">${fmtDate(lic.expires)}</span> – <span class="expired">Läuft in ${days} Tagen ab!</span> → <a href="mailto:fahr2rat@gmail.com" style="color:var(--blue)">fahr2rat@gmail.com</a>`;
  else el.innerHTML=`Lizenz gültig bis: <strong>${fmtDate(lic.expires)}</strong> · ${labelForTarget(lic.target)}`;
  renderTools(lic);
}

function doLogout() {
  sessionStorage.removeItem('2rat_s');
  document.getElementById('dashView').style.display='none';
  document.getElementById('loginView').style.display='flex';
  document.getElementById('codeInput').value='';
  document.getElementById('orgInput').value='';
}

window.addEventListener('DOMContentLoaded', () => {
  const s = sessionStorage.getItem('2rat_s');
  if (s) { try { const d=JSON.parse(s); const l=LICENSES.find(x=>x.hash===d.hash); if(l&&!isExpired(l.expires)) showDash(l,d.org); } catch(e){} }
});
document.getElementById('codeInput')?.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
