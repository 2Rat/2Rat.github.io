<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4532a">
<title>Verbrauchs-Logbuch</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f2; --card:#fff; --ink:#1c1b19; --muted:#6d6a64;
  --line:#e2dfd8; --accent:#b4532a; --accent-soft:#f3e3db; --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16151a; --card:#201f26; --ink:#eceaf2; --muted:#9b97a6;
    --line:#32303b; --accent:#e0794c; --accent-soft:#3a2a22}
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.25rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:.95rem;margin:0 0 12px}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
input,textarea,button,select{font:inherit}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;padding:11px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px}
input.ok{border:2px solid var(--accent)}
textarea{min-height:46px;resize:vertical}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);
  color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.5}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:8px;font-size:.85rem;width:auto;display:inline-block}
#f-foto{display:block;width:100%;padding:12px 8px;border:2px dashed var(--accent);border-radius:10px;
  background:var(--accent-soft);color:var(--ink);font-size:.85rem;margin-bottom:10px}
#f-foto::file-selector-button{font:inherit;padding:8px 10px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;font-weight:600;margin-right:8px}
.fotobox{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fotobox img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.entry{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .main{flex:1;min-width:0}
.entry .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entry .date{font-weight:600;font-size:.9rem}
.entry .val{font-size:.9rem;font-variant-numeric:tabular-nums}
.entry .meta{color:var(--muted);font-size:.79rem;margin-top:3px}
.entry .meta strong{color:var(--ink)}
.entry .note{font-size:.8rem;margin-top:3px;color:var(--muted);font-style:italic}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px;align-self:flex-start}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.kpi .n{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.73rem;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:16px 6px}
.info{font-size:.82rem;color:var(--muted);margin-top:6px}
.info.hint{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}
details summary{cursor:pointer;font-size:.9rem;font-weight:600;padding:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Verbrauchs-Logbuch</h1>

  <div class="card" id="key-card">
    <details id="key-details">
      <summary>API-Schlüssel <span id="key-state" class="info" style="display:inline"></span></summary>
      <div style="margin-top:10px">
        <label for="k-key">Anthropic API-Key (bleibt nur in diesem Browser)</label>
        <input type="password" id="k-key" placeholder="sk-ant-…">
        <label for="k-model">Modell</label>
        <select id="k-model">
          <option value="claude-sonnet-5">claude-sonnet-5 (genau)</option>
          <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (günstig)</option>
        </select>
        <button class="btn sec" id="k-save">Schlüssel speichern</button>
      </div>
    </details>
  </div>

  <div class="card">
    <h2>Neuer Eintrag</h2>

    <label for="f-foto">Foto vom Zähler</label>
    <input type="file" id="f-foto" accept="image/*">
    <div class="fotobox hidden" id="f-box">
      <img id="f-preview" alt="">
      <div>
        <div class="info hint" id="f-fotoinfo"></div>
        <button type="button" class="btn sec small" id="f-again" style="margin-top:6px">nochmal lesen</button>
      </div>
    </div>

    <label for="f-stand">Zählerstand kWh</label>
    <input type="text" inputmode="decimal" id="f-stand" placeholder="148463,2">

    <label for="f-temp">Außentemperatur °C</label>
    <input type="text" inputmode="decimal" id="f-temp" placeholder="8,5">

    <label for="f-ir">IR-Panel Stunden (leer = lief nicht)</label>
    <input type="text" inputmode="decimal" id="f-ir" placeholder="2">

    <label for="f-datum">Datum</label>
    <input type="date" id="f-datum">

    <label for="f-notiz">Notiz (optional)</label>
    <textarea id="f-notiz"></textarea>

    <button class="btn" id="f-save">Eintrag speichern</button>
    <div class="info" id="f-info"></div>
  </div>

  <div class="card">
    <h2>Übersicht</h2>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="card">
    <h2>Verlauf</h2>
    <div id="liste"><div class="empty">Noch keine Einträge.</div></div>
    <button class="btn sec hidden" id="seed" style="margin-top:12px">Bisherige vier Ablesungen übernehmen</button>
    <div class="row" style="margin-top:12px">
      <button class="btn sec small" id="exp-csv">CSV exportieren</button>
      <button class="btn sec small" id="exp-json">Sicherung (JSON)</button>
      <label class="btn sec small" for="imp-json" style="margin:0">Sicherung laden</label>
      <input type="file" id="imp-json" accept="application/json" class="hidden">
    </div>
    <div class="info" id="v-info"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var LS_DATA="logbuch.eintraege", LS_KEY="logbuch.apikey", LS_MODEL="logbuch.model";
  var eintraege=[], pendingFoto=null, pendingB64=null;
  var $=function(id){return document.getElementById(id)};

  var STARTWERTE=[
    {datum:"2026-09-11",stand:148418.2},
    {datum:"2026-09-17",stand:148424.4},
    {datum:"2026-09-20",stand:148432.1},
    {datum:"2026-09-26",stand:148463.2,notiz:"ab hier Klimaanlage in Betrieb"}
  ];

  function todayISO(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
  function num(v){if(v==null)return NaN;var s=String(v).trim().replace(/\s/g,"").replace(",",".");
    return s===""?NaN:parseFloat(s)}
  function fmt(n,d){d=d===undefined?1:d;return isFinite(n)?n.toLocaleString("de-DE",
    {minimumFractionDigits:d,maximumFractionDigits:d}):"–"}
  function dmy(iso){var p=(iso||"").split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0].slice(2):iso}
  function days(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
  function esc(s){return String(s||"").replace(/[<>&]/g,"")}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

  // ---- Speicher ----
  function laden(){try{eintraege=JSON.parse(localStorage.getItem(LS_DATA)||"[]")}catch(e){eintraege=[]}}
  function sichern(){try{localStorage.setItem(LS_DATA,JSON.stringify(eintraege))}catch(e){}}
  function getKey(){try{return localStorage.getItem(LS_KEY)||""}catch(e){return ""}}
  function getModel(){try{return localStorage.getItem(LS_MODEL)||"claude-sonnet-5"}catch(e){return "claude-sonnet-5"}}

  function keyState(){
    var k=getKey();
    $("key-state").textContent=k?"– gespeichert (…"+k.slice(-4)+")":"– fehlt";
    if(!k)$("key-details").open=true;
    $("k-model").value=getModel();
  }
  $("k-save").addEventListener("click",function(){
    var k=$("k-key").value.trim();
    if(k){try{localStorage.setItem(LS_KEY,k)}catch(e){}}
    try{localStorage.setItem(LS_MODEL,$("k-model").value)}catch(e){}
    $("k-key").value=""; keyState(); $("key-details").open=false;
  });

  $("f-datum").value=todayISO();

  // ---- Foto ----
  $("f-foto").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1600,w=img.width,h=img.height;
        if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        var dataUrl=c.toDataURL("image/jpeg",0.85);
        pendingB64=dataUrl.split(",")[1];
        $("f-preview").src=dataUrl;
        $("f-box").classList.remove("hidden");
        lesen();
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
  $("f-again").addEventListener("click",lesen);

  async function lesen(){
    var info=$("f-fotoinfo"), feld=$("f-stand"), key=getKey();
    if(!pendingB64)return;
    if(!key){info.textContent="Kein API-Schlüssel – oben eintragen, dann nochmal lesen.";$("key-details").open=true;return}
    info.textContent="Lese Zählerstand…"; feld.classList.remove("ok");
    try{
      var resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "content-type":"application/json",
          "x-api-key":key,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({
          model:getModel(), max_tokens:40,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:pendingB64}},
            {type:"text",text:"Auf dem Foto ist ein mechanischer Stromzähler mit Rollen-Zählwerk. "+
              "Lies den vollständigen Zählerstand in kWh ab. Die letzte Ziffer steht auf rotem Grund und ist die "+
              "Nachkommastelle (Beispiel: Rollen 1 4 8 4 6 3, rot 2 → 148463.2). "+
              "Antworte ausschließlich mit der Zahl, ohne Text."}
          ]}]
        })
      });
      if(!resp.ok){
        var et="";try{var ej=await resp.json();et=(ej.error&&ej.error.message)||""}catch(e){}
        info.textContent="API-Fehler "+resp.status+(et?": "+et.slice(0,90):"");return;
      }
      var j=await resp.json();
      var t=(j.content||[]).map(function(b){return b.text||""}).join(" ");
      var m=t.match(/(\d{4,7})\s*[.,]\s*(\d)\b/), v=m?parseFloat(m[1]+"."+m[2]):NaN;
      if(!isFinite(v)){var m2=t.match(/\b\d{5,7}\b/);v=m2?parseFloat(m2[0]):NaN}
      if(isFinite(v)){feld.value=fmt(v,1);feld.classList.add("ok");info.textContent="Gelesen – bitte kurz prüfen."}
      else info.textContent="Nicht erkannt ("+t.slice(0,50)+") – Stand bitte eintippen.";
    }catch(err){
      info.textContent="Verbindung fehlgeschlagen – Stand bitte eintippen.";
    }
  }

  function clearFoto(){
    pendingB64=null;$("f-foto").value="";
    $("f-box").classList.add("hidden");$("f-preview").removeAttribute("src");
    $("f-fotoinfo").textContent="";$("f-stand").classList.remove("ok");
  }

  // ---- Speichern ----
  $("f-save").addEventListener("click",function(){
    var info=$("f-info");
    var datum=$("f-datum").value, stand=num($("f-stand").value),
        temp=num($("f-temp").value), ir=num($("f-ir").value);
    if(!datum||!isFinite(stand)){info.textContent="Datum und Zählerstand sind nötig.";return}
    eintraege.push({id:uid(),datum:datum,stand:stand,temp:isFinite(temp)?temp:null,
      ir:isFinite(ir)?ir:null,notiz:$("f-notiz").value.trim(),erstellt:Date.now()});
    sichern(); render();
    $("f-stand").value="";$("f-temp").value="";$("f-ir").value="";$("f-notiz").value="";
    $("f-datum").value=todayISO(); clearFoto();
    info.textContent="Gespeichert.";
    setTimeout(function(){if(info.textContent==="Gespeichert.")info.textContent=""},2500);
  });

  $("seed").addEventListener("click",function(){
    if(eintraege.length)return;
    STARTWERTE.forEach(function(w,i){eintraege.push({id:uid()+i,datum:w.datum,stand:w.stand,temp:null,ir:null,
      notiz:w.notiz||"",erstellt:Date.now()+i})});
    sichern(); render();
  });

  function del(id){
    if(!window.confirm("Eintrag löschen?"))return;
    eintraege=eintraege.filter(function(e){return e.id!==id}); sichern(); render();
  }
  function sorted(){return eintraege.slice().sort(function(a,b){return a.datum<b.datum?-1:a.datum>b.datum?1:0})}

  // ---- Export / Import ----
  function download(name,text,type){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
  $("exp-csv").addEventListener("click",function(){
    var s=sorted(), lines=["datum;stand_kwh;kwh_seit_letzter;tage;kwh_pro_tag;temp_c;ir_stunden;notiz"];
    s.forEach(function(e,i){
      var p=s[i-1], d=p?days(p.datum,e.datum):"", diff=p?e.stand-p.stand:"";
      lines.push([e.datum,String(e.stand).replace(".",","),
        diff===""?"":diff.toFixed(1).replace(".",","), d,
        (p&&d>0)?(diff/d).toFixed(2).replace(".",","):"",
        e.temp==null?"":String(e.temp).replace(".",","),
        e.ir==null?"":String(e.ir).replace(".",","),
        (e.notiz||"").replace(/;/g,",")].join(";"));
    });
    download("verbrauch.csv","\ufeff"+lines.join("\r\n"),"text/csv");
  });
  $("exp-json").addEventListener("click",function(){
    download("logbuch-sicherung.json",JSON.stringify(eintraege,null,1),"application/json");
  });
  $("imp-json").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var arr=JSON.parse(r.result); if(!Array.isArray(arr))throw 0;
        var ids={};eintraege.forEach(function(x){ids[x.id]=1});
        var neu=0;arr.forEach(function(x){if(x&&x.datum&&isFinite(x.stand)&&!ids[x.id]){eintraege.push(x);neu++}});
        sichern();render();$("v-info").textContent=neu+" Einträge übernommen.";
      }catch(err){$("v-info").textContent="Datei nicht lesbar."}
      e.target.value="";
    };
    r.readAsText(f);
  });

  // ---- Rendern ----
  function render(){
    var box=$("liste"), s=sorted();
    $("seed").classList.toggle("hidden", eintraege.length>0);
    var gesamt=s.length>1?s[s.length-1].stand-s[0].stand:NaN;
    var tage=s.length>1?days(s[0].datum,s[s.length-1].datum):NaN;
    var letzt=null;
    if(s.length>1){var d=days(s[s.length-2].datum,s[s.length-1].datum);
      letzt=d>0?(s[s.length-1].stand-s[s.length-2].stand)/d:NaN}
    var irSum=s.reduce(function(a,e){return a+(e.ir||0)},0);
    $("kpis").innerHTML=
      '<div class="kpi"><div class="n">'+fmt(gesamt)+'</div><div class="l">kWh gesamt'+(isFinite(tage)?" ("+tage+" Tage)":"")+'</div></div>'+
      '<div class="kpi"><div class="n">'+(isFinite(gesamt/tage)?fmt(gesamt/tage,2):"–")+'</div><div class="l">Ø kWh pro Tag</div></div>'+
      '<div class="kpi"><div class="n">'+(letzt!==null?fmt(letzt,2):"–")+'</div><div class="l">zuletzt kWh pro Tag</div></div>'+
      '<div class="kpi"><div class="n">'+fmt(irSum,1)+'</div><div class="l">IR-Stunden gesamt</div></div>';
    if(!s.length){box.innerHTML='<div class="empty">Noch keine Einträge.</div>';return}
    var r=s.slice().reverse(); box.innerHTML="";
    r.forEach(function(e,i){
      var prev=r[i+1], row=document.createElement("div"); row.className="entry";
      var meta=[];
      if(prev){var d=days(prev.datum,e.datum),diff=e.stand-prev.stand;
        if(d>0)meta.push(fmt(diff)+" kWh / "+d+" Tg. = <strong>"+fmt(diff/d,2)+" kWh pro Tag</strong>")}
      if(e.temp!=null)meta.push(fmt(e.temp)+" °C");
      if(e.ir!=null)meta.push("IR "+fmt(e.ir,1)+" h");
      var main=document.createElement("div");main.className="main";
      main.innerHTML='<div class="top"><span class="date">'+dmy(e.datum)+'</span><span class="val">'+fmt(e.stand)+' kWh</span></div>'+
        (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+(e.notiz?'<div class="note">'+esc(e.notiz)+'</div>':'');
      var b=document.createElement("button");b.className="del";b.textContent="×";
      b.addEventListener("click",function(){del(e.id)});
      row.appendChild(main);row.appendChild(b);box.appendChild(row);
    });
  }

  laden(); keyState(); render();
})();
</script>
</body>
</html>
