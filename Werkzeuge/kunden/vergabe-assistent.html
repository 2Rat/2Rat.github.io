const THRESHOLDS_2026 = { bau: 5404000, liefer_dl: 216000, freiberuflich: 216000 };
const LEISTUNGSARTEN = [
  { id: "bau", label: "Bau", icon: "\u{1F3D7}️" },

function formatEuro(val) { return val.toLocaleString("de-DE") + " €"; }

function getVerfahren(wert, art) {
  const sw = THRESHOLDS_2026[art];
  if (wert <= 0) return null;
  if (wert <= 100000) {
    return {
      level: "direkt", name: "Direktauftrag", color: "#659444",
      bgColor: "#ecfdf5", borderColor: "#a7f3d0", tagLabel: "Einfachstes Verfahren",
      kurz: "Kein förmliches Verfahren nötig. Auftrag direkt vergeben.",
      pflicht: [
        "Haushaltsmittel verfügbar?",
        "Vergabevermerk anlegen (Bedarf + Wirtschaftlichkeit)",
        "Auftrag erteilen",
      ],
      empfohlen: [
        "Vergleichsangebot einholen (Markterkundung)",
        "Mehr-Augen-Prinzip bei > 25.000 €",
      ],
      nurBeiBedarf: [
        "Bei Fördermitteln: ANBest-Vorgaben des Fördermittelgebers prüfen",
        "Werkstätten für behinderte Menschen / Inklusionsbetriebe berücksichtigen",
      ],
      rechtsgrundlagen: [
        "Vergabeerlass SL 2025 (Amtsbl. 26/2025) – Direktauftrag bis 100.000 €",
        "§ 82 KSVG",
        art === "bau" ? "§ 3a Abs. 4 VOB/A (Direktauftrag)" : "§ 14 UVgO (Direktauftrag)",
      ],
    };
  }
  if (wert <= sw) {
    const isNahSchwelle = wert > sw * 0.8;
    return {
      level: "vereinfacht",
      name: "Freihändige Vergabe oder Beschränkte Ausschreibung",
      color: "#f59e0b", bgColor: "#fffbeb", borderColor: "#fde68a",
      tagLabel: "Unterhalb EU-Schwellenwert",
      kurz: "Im Saarland sind seit dem Vergabeerlass 2025 oberhalb 100.000 € bis zum EU-Schwellenwert beide Verfahren frei wählbar – Sie entscheiden je nach Markt und Leistung. In beiden Fällen mind. 3 Angebote bzw. Bieter einholen und dokumentieren.",
      pflicht: [
        "Haushaltsmittel verfügbar?",
        "Leistungsbeschreibung erstellen",
        "Verfahren wählen: Freihändige Vergabe oder Beschränkte Ausschreibung",
        "Mind. 3 Angebote einholen bzw. Bieter auffordern",
        "Angebote vergleichen + dokumentieren",
        "Vergabevermerk mit Verfahrenswahl-Begründung",
      ],
      empfohlen: [
        "Gleichbehandlung dokumentieren (keine Ortspräferenz)",
        "Antikorruption: Rotation, Mehr-Augen-Prinzip",
        ...(isNahSchwelle ? ["⚠️ Nähe EU-Schwellenwert – Puffer einplanen!"] : []),
      ],
      nurBeiBedarf: [
        "Bei Fördermitteln: ANBest-Vorgaben prüfen",
        "Werkstätten / Inklusionsbetriebe berücksichtigen",
      ],
      rechtsgrundlagen: [
        "Vergabeerlass SL 2025 (Amtsbl. 26/2025) – Freihändige Vergabe und Beschränkte Ausschreibung bis zum EU-Schwellenwert zulässig",
        "§ 82 KSVG",
        art === "bau" ? "VOB/A Abschnitt 1 (§§ 3, 3a)" : "UVgO (§§ 8–12)",
      ],
    };
  }
  return {
    level: "eu", name: "EU-weite Ausschreibung", color: "#ef4444",
    bgColor: "#fef2f2", borderColor: "#fecaca", tagLabel: "EU-Vergaberecht",
    kurz: "Förmliches EU-Verfahren nach GWB/VgV. Fristen, Bekanntmachung, Dokumentation zwingend.",
    pflicht: [
      "Bedarfsermittlung + Kostenschätzung",
      "Vergabeart festlegen (offen / nichtoffen / Verhandlung)",
      "Leistungsbeschreibung produktneutral erstellen",
      "Eignungs- und Zuschlagskriterien vorab festlegen",
      "EU-weite Bekanntmachung (TED)",
      "Vergabeunterlagen elektronisch bereitstellen",
      "Fristen nach VgV/VOB/A-EU einhalten",
      "Angebotswertung + Vergabevermerk",
      "Informationspflicht § 134 GWB (Wartefrist)",
    ],
    empfohlen: [
      "Rechtliche Beratung einholen",
      "Vorinformation (Vorabbekanntmachung) prüfen",
    ],
    nurBeiBedarf: [
      "Fördermittelvorgaben prüfen",
      "Werkstätten / Inklusionsbetriebe",
    ],
    rechtsgrundlagen: [
      "GWB, 4. Teil",
      art === "bau" ? "VOB/A Abschnitt 2 (EU)" : "VgV",
      "§ 82 KSVG",
      "EU-SW 2026/27: " + THRESHOLDS_2026[art].toLocaleString("de-DE") + " €",
    ],
  };

function StepRow({ text, done, onToggle, type }) {
  const colors = {
    pflicht: { check: "#659444" },
    empfohlen: { check: "#f59e0b" },
    bedarf: { check: "#1678A9" },
  };
  const c = colors[type];
  const isWarning = text.startsWith("⚠");
  return e("div", {
    onClick: onToggle, className: "step-row",
    role: "button", tabIndex: 0, "aria-pressed": done,
    onKeyDown: function(ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onToggle(); } },
    style: {
      display: "flex", alignItems: "center", gap: 12,
      padding: "12px 14px", cursor: "pointer", borderRadius: 10,
      background: done ? (type === "pflicht" ? "#f0fdf4" : type === "empfohlen" ? "#fffbeb" : "#f0f9ff") : "transparent",
      transition: "all 0.15s ease", userSelect: "none",
      borderLeft: "3px solid " + (done ? c.check : "transparent"),
    }
  },
    e("div", { style: {
      width: 24, height: 24, minWidth: 24, borderRadius: 7,
      border: "2px solid " + (done ? c.check : "#d1d5db"),
      background: done ? c.check : "#fff",
      display: "flex", alignItems: "center", justifyContent: "center",
      transition: "all 0.15s ease",
    }}, done ? e("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "#fff", strokeWidth: 3, strokeLinecap: "round", strokeLinejoin: "round" }, e("polyline", { points: "20 6 9 17 4 12" })) : null),
    e("span", { style: {
      fontSize: 14, lineHeight: 1.5,
      color: done ? "#9ca3af" : isWarning ? "#b45309" : "#1f2937",
      textDecoration: done ? "line-through" : "none",
      fontWeight: isWarning ? 600 : 400, flex: 1,
    }}, text)
  );
}

function Collapsible({ title, badge, children }) {
  const [open, setOpen] = useState(false);
  return e("div", null,
    e("button", {
      onClick: function() { setOpen(!open); },
      "aria-expanded": open,
      style: {
        width: "100%", display: "flex", alignItems: "center", gap: 8,
        padding: "10px 14px", background: "none", border: "none",
        cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#6b7280", textAlign: "left",
      }
    },
      e("span", { style: { transform: open ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.2s", fontSize: 10, display: "inline-block" }}, "▶"),
      title,
      badge ? e("span", { style: { fontSize: 11, fontWeight: 500, padding: "2px 8px", borderRadius: 10, background: "#f1f5f9", color: "#64748b" }}, badge) : null
    ),
    open ? e("div", { style: { paddingLeft: 4 }}, children) : null
  );
}

function VermerkGenerator({ wert, art, verfahren }) {
  const [copied, setCopied] = useState(false);
  const [show, setShow] = useState(false);
  const artLabel = LEISTUNGSARTEN.find(function(l) { return l.id === art; })?.label || art;
  const today = new Date().toLocaleDateString("de-DE");
  var text;
  if (verfahren.level === "direkt") {
    text = "Vergabevermerk – Direktauftrag\n\nDatum: " + today + "\nLeistungsart: " + artLabel + "\nGesch. Auftragswert: " + formatEuro(wert) + " (netto)\nVerfahren: Direktauftrag gem. Vergabeerlass SL 2025\n\nBegründung:\nDer geschätzte Auftragswert liegt unterhalb der Wertgrenze von 100.000 € netto für Direktaufträge gem. Vergabeerlass SL 2025 (Amtsbl. Nr. 26/2025). Die Vergabe erfolgt unter Beachtung der Haushaltsgrundsätze der Wirtschaftlichkeit und Sparsamkeit (§ 82 KSVG).\n\nAuftragnehmer: ___________________________\nAngebotssumme: _______________ € netto\nWirtschaftlichkeit: ___________________________\n\nUnterschrift: ___________________________";
  } else if (verfahren.level === "vereinfacht") {
    text = "Vergabevermerk – Verfahren unterhalb EU-Schwellenwert\n\nDatum: " + today + "\nLeistungsart: " + artLabel + "\nGesch. Auftragswert: " + formatEuro(wert) + " (netto)\nGewähltes Verfahren: □ Freihändige Vergabe   □ Beschränkte Ausschreibung\n\nBegründung Verfahrenswahl:\nDer gesch. Auftragswert liegt oberhalb der Direktauftragsgrenze (100.000 €) und unterhalb des EU-Schwellenwerts (" + formatEuro(THRESHOLDS_2026[art]) + "). Nach dem Vergabeerlass SL 2025 (Amtsbl. Nr. 26/2025) sind in diesem Bereich sowohl die Freihändige Vergabe als auch die Beschränkte Ausschreibung ohne weitere Einzelbegründung zulässig.\n\nBeteiligte Bieter:\n1. _______________ – Angebot: ___________ €\n2. _______________ – Angebot: ___________ €\n3. _______________ – Angebot: ___________ €\n\nZuschlag an: ___________________________\nBegründung: ___________________________\n\nUnterschrift: ___________________________";
  } else {
    text = "Vergabevermerk – EU-weites Verfahren\n\nDatum: " + today + "\nLeistungsart: " + artLabel + "\nGesch. Auftragswert: " + formatEuro(wert) + " (netto)\n\nDer Auftragswert erreicht/überschreitet den EU-Schwellenwert (" + formatEuro(THRESHOLDS_2026[art]) + "). Vollständiger Vergabevermerk gem. § 8 VgV erforderlich.\n\n[Hinweis: Rechtliche Beratung empfohlen]";
  }
  function handleCopy() {
    navigator.clipboard.writeText(text).then(function() {
      setCopied(true);
      setTimeout(function() { setCopied(false); }, 2000);
    });
  }
  return e("div", { style: { background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", marginBottom: 12 }},
    e("button", { onClick: function() { setShow(!show); }, "aria-expanded": show, style: { width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", background: "none", border: "none", cursor: "pointer" }},
      e("span", { style: { fontSize: 14, fontWeight: 700, color: "#1e293b" }}, "\u{1F4DD} Vergabevermerk-Vorlage"),
      e("span", { style: { transform: show ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.2s", fontSize: 10, color: "#94a3b8" }}, "▶")
    ),
    show ? e("div", null,
      e("div", { style: { padding: "0 16px 8px", display: "flex", justifyContent: "flex-end" }},
        e("button", { onClick: handleCopy, style: { padding: "6px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", background: copied ? "#659444" : "#1678A9", color: "#fff", transition: "all 0.2s" }},
          copied ? "✓ Kopiert!" : "In Zwischenablage kopieren")
      ),
      e("pre", { style: { padding: "14px 16px", margin: 0, fontSize: 12, lineHeight: 1.7, color: "#374151", background: "#f8fafc", whiteSpace: "pre-wrap", fontFamily: "ui-monospace, Consolas, monospace", maxHeight: 280, overflowY: "auto", borderTop: "1px solid #f1f5f9" }}, text)
    ) : null
  );
}

function App() {
  const [art, setArt] = useState(null);
  const [wertInput, setWertInput] = useState("");
  const [wert, setWert] = useState(0);
  const [checks, setChecks] = useState({});
  const resultRef = useRef(null);

  function parseWert(input) {
    var cleaned = input.replace(/[^\d,.]/g, "").replace(/\./g, "").replace(",", ".");
    return parseFloat(cleaned) || 0;
  }

  var verfahren = art && wert > 0 ? getVerfahren(wert, art) : null;

  useEffect(function() {
    setChecks({});
    if (verfahren) {
      setTimeout(function() { resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }); }, 120);
    }
  }, [art, wert]);

  function toggle(key) { setChecks(function(prev) { var n = {}; for (var k in prev) n[k] = prev[k]; n[key] = !prev[key]; return n; }); }
  var pflichtDone = verfahren ? verfahren.pflicht.filter(function(_, i) { return checks["p" + i]; }).length : 0;
  var pflichtTotal = verfahren ? verfahren.pflicht.length : 0;
  var allDone = pflichtDone === pflichtTotal && pflichtTotal > 0;

  return e("div", { style: { minHeight: "100vh", background: "#f8fafc" }},
    // Header (2Rat-Branding)
    e("div", { className: "app-header", style: { background: "#fff", padding: "16px 20px", borderBottom: "3px solid #659444" }},
      e("div", { style: { maxWidth: 640, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }},
        e("div", { style: { display: "flex", alignItems: "center", gap: 14 }},
          e("img", { src: LOGO, alt: "2Rat – Büro für Radverkehrsplanung", style: { height: 38 }}),
          e("div", null,
            e("div", { style: { fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#8a8a8a" }}, "Büro für Radverkehrsplanung"),
            e("h1", { style: { fontSize: 17, fontWeight: 700, color: "#3E403F", margin: 0, lineHeight: 1.3 }}, "Vergabe-Assistent ", e("span", { style: { color: "#1678A9" }}, "Saarland"))
          )
        ),
        e("div", { className: "header-meta", style: { textAlign: "right", fontSize: 11, color: "#8a8a8a", lineHeight: 1.5 }}, "Saarland", e("br"), "Vergabeerlass 2025 · EU-SW 2026", e("br"), "Stand 06/2026")
      )
    ),
    e("div", { style: { maxWidth: 640, margin: "0 auto", padding: "20px 16px 60px" }},
      // Input Card
      e("div", { className: "input-card", style: { background: "#fff", borderRadius: 14, padding: 16, border: "1px solid #e2e8f0", marginBottom: 16, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }},
        // Leistungsart
        e("div", { style: { marginBottom: 14 }},
          e("label", { style: { fontSize: 12, fontWeight: 600, color: "#64748b", display: "block", marginBottom: 8 }}, "Leistungsart"),
          e("div", { style: { display: "flex", gap: 8 }},
            LEISTUNGSARTEN.map(function(l) {
              return e("button", {
                key: l.id, className: "art-btn",
                onClick: function() { setArt(l.id); },
                "aria-pressed": art === l.id,
                style: {
                  flex: 1, padding: "10px 8px", borderRadius: 10,
                  border: art === l.id ? "2px solid #1678A9" : "2px solid #e2e8f0",
                  background: art === l.id ? "#e8f4fa" : "#fff",
                  cursor: "pointer", textAlign: "center",
                }
              },
                e("div", { style: { fontSize: 20 }}, l.icon),
                e("div", { style: { fontSize: 12, fontWeight: art === l.id ? 700 : 500, color: art === l.id ? "#115d85" : "#6b7280", marginTop: 2 }}, l.label)
              );
            })
          )
        ),
        // Auftragswert
        e("div", null,
          e("label", { htmlFor: "wertInput", style: { fontSize: 12, fontWeight: 600, color: "#64748b", display: "block", marginBottom: 8 }}, "Auftragswert netto"),
          e("div", { style: { display: "flex", borderRadius: 10, border: "2px solid #e2e8f0", overflow: "hidden" }},
            e("input", {
              id: "wertInput", type: "text", value: wertInput, inputMode: "numeric",
              onChange: function(ev) { setWertInput(ev.target.value); setWert(parseWert(ev.target.value)); },
              placeholder: "z.B. 75000",
              style: { flex: 1, padding: "10px 14px", fontSize: 18, border: "none", fontFamily: "ui-monospace, monospace", color: "#1e293b", outline: "none", background: "transparent" }
            }),
            e("div", { style: { padding: "10px 14px", fontSize: 14, fontWeight: 600, color: "#94a3b8", background: "#f8fafc", borderLeft: "1px solid #e2e8f0", display: "flex", alignItems: "center" }}, "€")
          ),
          e("div", { style: { display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }},
            [5000, 50000, 100000, 150000, 250000].map(function(v) {
              return e("button", {
                key: v, className: "quick-btn",
                onClick: function() { setWertInput(v.toString()); setWert(v); },
                style: {
                  padding: "4px 10px", borderRadius: 6, fontSize: 11,
                  border: "1px solid #e2e8f0", background: wert === v ? "#e8f4fa" : "#fff",
                  color: "#64748b", cursor: "pointer",
                  fontFamily: "ui-monospace, monospace", fontWeight: 500,
                }
              }, v >= 1000 ? (v / 1000) + "k" : v);
            })
          )
        )
      ),

      // RESULT
      verfahren ? e("div", { ref: resultRef, className: "result-enter" },
        // Badge
        e("div", { style: { background: verfahren.bgColor, border: "2px solid " + verfahren.borderColor, borderRadius: 14, padding: "16px 18px", marginBottom: 12 }},
          e("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }},
            e("div", { style: { padding: "3px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, background: verfahren.color, color: "#fff", textTransform: "uppercase", letterSpacing: "0.04em" }}, verfahren.tagLabel),
            e("span", { style: { fontSize: 11, color: "#94a3b8", fontFamily: "ui-monospace, monospace" }}, formatEuro(wert))
          ),
          e("h2", { style: { fontSize: 20, fontWeight: 700, color: "#1e293b", margin: "0 0 4px" }}, verfahren.name),
          e("p", { style: { fontSize: 14, color: "#4b5563", margin: 0, lineHeight: 1.5 }}, verfahren.kurz)
        ),

        // Pflicht
        e("div", { style: { background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }},
          e("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: "1px solid #f1f5f9" }},
            e("div", { style: { display: "flex", alignItems: "center", gap: 8 }},
              e("span", { style: { width: 8, height: 8, borderRadius: "50%", background: allDone ? "#659444" : "#ef4444", display: "inline-block" }}),
              e("span", { style: { fontSize: 14, fontWeight: 700, color: "#1e293b" }}, "Pflichtschritte")
            ),
            e("span", { style: { fontSize: 13, fontWeight: 700, fontFamily: "ui-monospace, monospace", color: allDone ? "#659444" : "#6b7280" }}, pflichtDone + "/" + pflichtTotal)
          ),
          e("div", { style: { padding: "4px 4px" }},
            verfahren.pflicht.map(function(t, i) {
              return e(StepRow, { key: "p" + i, text: t, done: !!checks["p" + i], onToggle: function() { toggle("p" + i); }, type: "pflicht" });
            })
          ),
          allDone ? e("div", { style: { padding: "10px 16px", background: "#f0fdf4", borderTop: "1px solid #bbf7d0", fontSize: 13, fontWeight: 600, color: "#059669", textAlign: "center" }}, "✅ Fertig – Auftrag kann erteilt werden") : null
        ),

        // Empfohlen
        e("div", { style: { background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }},
          e(Collapsible, { title: "\u{1F4A1} Empfohlen", badge: "" + verfahren.empfohlen.length },
            e("div", { style: { padding: "0 4px 4px" }},
              verfahren.empfohlen.map(function(t, i) {
                return e(StepRow, { key: "e" + i, text: t, done: !!checks["e" + i], onToggle: function() { toggle("e" + i); }, type: "empfohlen" });
              })
            )
          )
        ),

        // Nur bei Bedarf
        e("div", { style: { background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }},
          e(Collapsible, { title: "\u{1F4CE} Nur bei Bedarf", badge: "" + verfahren.nurBeiBedarf.length },
            e("div", { style: { padding: "0 4px 4px" }},
              verfahren.nurBeiBedarf.map(function(t, i) {
                return e(StepRow, { key: "b" + i, text: t, done: !!checks["b" + i], onToggle: function() { toggle("b" + i); }, type: "bedarf" });
              })
            )
          )
        ),

        // Vergabevermerk
        e(VermerkGenerator, { wert: wert, art: art, verfahren: verfahren }),

        // Rechtsgrundlagen
        e("div", { style: { background: "#fff", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }},
          e(Collapsible, { title: "\u{1F4DA} Rechtsgrundlagen", badge: "" + verfahren.rechtsgrundlagen.length },
            e("div", { style: { padding: "0 4px 8px" }},
              verfahren.rechtsgrundlagen.map(function(rg, i) {
                return e("div", { key: i, style: { padding: "6px 14px", fontSize: 13, color: "#374151", background: i % 2 === 0 ? "#f8fafc" : "transparent", borderRadius: 6, marginBottom: 1 }}, rg);
              })
            )
          )
        )
      ) : null,

      // Footer (2Rat)
      e("div", { style: { marginTop: 32, padding: "12px 16px", borderRadius: 10, background: "rgba(0,0,0,0.02)", border: "1px solid #e2e8f0" }},
        e("p", { style: { fontSize: 10, color: "#a1a1aa", margin: 0, lineHeight: 1.6 }},
          "Orientierungshilfe, keine Rechtsberatung. Grundlage: Vergabeerlass SL 2025 (Amtsbl. 26/2025, ab 01.07.2025 unbefristet) – Direktauftrag bis 100.000 €, darüber Freihändige Vergabe oder Beschränkte Ausschreibung bis zum EU-Schwellenwert (2026/27: Bau 5.404.000 €, Liefer/DL 216.000 €). KSVG §§ 82 ff. Alle Werte netto. Bei Fördermitteln ggf. strengere Vorgaben. Stand 06/2026."
        ),
        e("p", { style: { fontSize: 10, color: "#a1a1aa", margin: "6px 0 0", lineHeight: 1.6 }},
          "© 2Rat · Armin Jung · Radverkehrsplaner EIPOS · www.2rat.org"
        )
      )
    )
  );
}
